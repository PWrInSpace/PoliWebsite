name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.0
          cache: 'npm'

      - name: Install dependencies
        uses: bahmutov/npm-install@v1 

      - name: Build project
        run: npm run production

      - name: Upload production-ready build files
        uses: actions/upload-artifact@v7
        with:
          name: production-files
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        id: download
        uses: actions/download-artifact@v8
        with:
          name: production-files
          path: ./dist
      
      - name: Connect to PWr GlobalProtect VPN
        env:
          VPN_PASS: ${{ secrets.VPN_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y openconnect vpnc-scripts
          echo "$VPN_PASS" | sudo openconnect \
            --protocol=gp \
            --user="${{ secrets.VPN_LOGIN }}" \
            --os=mac-intel \
            --useragent="PAN GlobalProtect App/5.2.6-86" \
            --passwd-on-stdin \
            --non-inter \
            --dump-http-traffic \
            --background \
            ${{ secrets.VPN_PORTAL }}
          
          sleep 5

      - name: Deploy to server
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: "${{ secrets.SERVER_IP }}"
          port: "${{ secrets.SERVER_SFTP_PORT }}"
          username: "${{ secrets.SSH_LOGIN }}"
          password: "${{ secrets.SSH_PASSWORD }}"
          local_path: "./dist/*"
          remote_path: "public_html"
          sftp_only: true
